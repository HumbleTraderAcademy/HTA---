<script>
// ============================================================
// HUMBLE TRADER ACADEMY — 永續合約數據網站 v4
// 幣安合約+現貨 API｜雙 CVD（現貨/合約）、吸收 vs 衰竭、組合判讀
// ============================================================
const FAPI = "https://fapi.binance.com", SAPI = "https://api.binance.com";
const GREEN = "#4ade80", RED = "#f87171", GREY = "#262626", NEU = "#e5e5e5";
const PERIODS = [["15m","15分"],["1h","1時"],["4h","4時"]];

const state = { coins:null, query:"", sort:"vol", period:"1h", view:"market", selected:null, data:null, live:null, tab:"long", expanded:null, updatedAt:null, alerts:[], alertStatus:null, alertProg:0, chart:null };
const cache = {}, inflight = new Set(), thr = {};
let watch = []; try { watch = JSON.parse(localStorage.getItem("hta_watch") || "[]"); } catch {}
function saveWatch(){ try { localStorage.setItem("hta_watch", JSON.stringify(watch)); } catch {} }
function isWatched(s){ return watch.indexOf(s) >= 0; }
function toggleWatch(s){ const i = watch.indexOf(s); if (i < 0) watch.push(s); else watch.splice(i, 1); saveWatch(); }
let refreshTimer = null;

function throttle(k, fn, ms=500){ const n=Date.now(); if(n-(thr[k]||0)<ms) return; thr[k]=n; fn(); }
async function jget(base, path, ms=9000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(base+path,{signal:c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); } finally{ clearTimeout(t); } }
const bfetch = (p,ms) => jget(FAPI,p,ms);
async function pool(items,n,fn){ const q=items.slice(); await Promise.all(Array.from({length:n},async()=>{ while(q.length) await fn(q.shift()); })); }

// ---------- CVD：由 K 線主動買量累積 ----------
function buildCVD(kl){
  let cum=0; const cvd=[], cvdO=[], op=[], hi=[], lo=[], cl=[], vol=[];
  kl.forEach(k=>{ const v=parseFloat(k[5]), tb=parseFloat(k[9]); cvdO.push(cum); cum += 2*tb - v; cvd.push(cum);
    op.push(parseFloat(k[1])); hi.push(parseFloat(k[2])); lo.push(parseFloat(k[3])); cl.push(parseFloat(k[4])); vol.push(v); });
  return { cvd, cvdO, op, hi, lo, cl, vol };
}
// 淨主動買賣佔成交量比例(%)：正=市價買主導
function netPct(cvd, vol, look){
  const n=cvd.length, st=Math.max(0,n-look); const d=cvd[n-1]-cvd[st];
  const v=vol.slice(st).reduce((a,b)=>a+b,0); return v? d/v*100 : 0;
}
// ---------- 結構判定：吸收(Absorption) / 衰竭(Exhaustion) ----------
function structOf(hi, lo, cl, cvd){
  const n=cvd.length; if(n<20) return null; const h=Math.floor(n/2);
  const eH=Math.max(...hi.slice(0,h)), rH=Math.max(...hi.slice(h));
  const eL=Math.min(...lo.slice(0,h)), rL=Math.min(...lo.slice(h));
  const eCH=Math.max(...cvd.slice(0,h)), rCH=Math.max(...cvd.slice(h));
  const eCL=Math.min(...cvd.slice(0,h)), rCL=Math.min(...cvd.slice(h));
  const bear=()=> (rH<=eH && rCH>eCH) ? {dir:"bear",kind:"absorb",type:"吸收型 (Absorption)",desc:"CVD 創新高但價格未能同步創高——散戶追多的市價買單被主力限價賣單默默吸收，屬誘多、頂部派發訊號。"}
                : (rH>eH && rCH<=eCH) ? {dir:"bear",kind:"exhaust",type:"衰竭型 (Exhaustion)",desc:"價格創新高但主動買盤未同步創高——買方動能衰竭，上漲缺乏成交配合，容易轉弱。"} : null;
  const bull=()=> (rL>=eL && rCL<eCL) ? {dir:"bull",kind:"absorb",type:"吸收型 (Absorption)",desc:"CVD 創新低（賣壓持續）但價格守住不破底——散戶拋售被主力限價買單全數吃下，屬底部建倉訊號。"}
                : (rL<eL && rCL>=eCL) ? {dir:"bull",kind:"exhaust",type:"衰竭型 (Exhaustion)",desc:"價格破底但主動賣壓未同步創低——賣方動能衰竭，殺盤無以為繼，有反彈可能。"} : null;
  return (cl[n-1]>=cl[h]) ? (bear()||bull()) : (bull()||bear());
}
function candles(o,h,l,c,H=76,N=30){
  const s=Math.max(0,o.length-N); o=o.slice(s); h=h.slice(s); l=l.slice(s); c=c.slice(s);
  const n=o.length; if(!n) return ""; const W=300;
  const mn=Math.min(...l), mx=Math.max(...h), r=(mx-mn)||1, y=v=>H-(v-mn)/r*H, bw=W/n*0.62;
  let g="";
  for(let i=0;i<n;i++){ const x=(i+0.5)*W/n, up=c[i]>=o[i], col=up?GREEN:RED;
    g+=`<line x1="${x.toFixed(1)}" y1="${y(h[i]).toFixed(1)}" x2="${x.toFixed(1)}" y2="${y(l[i]).toFixed(1)}" stroke="${col}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    const yo=y(o[i]), yc=y(c[i]), top=Math.min(yo,yc), hh=Math.max(1,Math.abs(yc-yo));
    g+=`<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="${col}"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">${g}</svg>`; }

const spotSym = s => s.replace(/^1000000/,"").replace(/^1000/,"");
let spotName = {};
async function spotKlines(symbol, period){
  const tries=[symbol]; const alt=spotSym(symbol); if(alt!==symbol) tries.push(alt);
  for(const s of tries){ try{ const d=await jget(SAPI,`/api/v3/klines?symbol=${s}&interval=${period}&limit=48`); if(Array.isArray(d)&&d.length>20){ spotName[symbol]=s; return d; } }catch{} }
  return null;
}
// ---------- 低時框聚合：產生帶影線的 CVD K 棒 ----------
const MSOF={"15m":900000,"1h":3600000,"4h":14400000};
const LTFOF={"15m":["1m",480],"1h":["5m",400],"4h":["15m",500]};
async function cvdCandles(isSpot, symbol, period){
  const [iv,lim]=LTFOF[period];
  const kl = isSpot ? await jget(SAPI,`/api/v3/klines?symbol=${symbol}&interval=${iv}&limit=${lim}`)
                    : await bfetch(`/fapi/v1/klines?symbol=${symbol}&interval=${iv}&limit=${lim}`);
  const b=MSOF[period]; let cum=0,cur=null,o=0,h=0,l=0; const out=[];
  kl.forEach(k=>{ const key=Math.floor(k[0]/b), d=2*parseFloat(k[9])-parseFloat(k[5]);
    if(key!==cur){ if(cur!==null) out.push({o,h,l,c:cum}); cur=key; o=cum; h=cum; l=cum; }
    cum+=d; if(cum>h)h=cum; if(cum<l)l=cum; });
  if(cur!==null) out.push({o,h,l,c:cum});
  return out;
}
async function loadChart(){
  const sym=state.selected, per=state.period, stale=()=>state.selected!==sym||state.period!==per;
  state.chart={status:"loading"}; patchChart();
  try{
    const perp=await cvdCandles(false,sym,per); if(stale()) return;
    let sp=null; if(state.data&&state.data.hasSpot){ try{ sp=await cvdCandles(true, spotName[sym]||sym, per); }catch{} }
    if(stale()) return; state.chart={status:"done",perp,spot:sp}; patchChart();
  }catch{ if(!stale()){ state.chart={status:"error"}; patchChart(); } }
}
function patchChart(){ const e=document.getElementById("cvdsec"); if(e&&state.data) e.outerHTML=cvdSection(state.data); }

// ---------- 抓取指標 ----------
async function fetchIndicators(symbol, ticker, period){
  const [kl, sKl, oiHist, prem, frHist, lsArr, top] = await Promise.all([
    bfetch(`/fapi/v1/klines?symbol=${symbol}&interval=${period}&limit=48`),
    spotKlines(symbol, period),
    bfetch(`/futures/data/openInterestHist?symbol=${symbol}&period=${period}&limit=13`),
    bfetch(`/fapi/v1/premiumIndex?symbol=${symbol}`),
    bfetch(`/fapi/v1/fundingRate?symbol=${symbol}&limit=6`).catch(()=>[]),
    bfetch(`/futures/data/globalLongShortAccountRatio?symbol=${symbol}&period=${period}&limit=6`),
    bfetch(`/futures/data/topLongShortPositionRatio?symbol=${symbol}&period=${period}&limit=1`).catch(()=>[]),
  ]);
  const P = buildCVD(kl); const S = sKl ? buildCVD(sKl) : null;
  const n=P.cl.length, st=Math.max(0,n-13);
  const oi=oiHist.map(x=>parseFloat(x.sumOpenInterest));
  const frPct=parseFloat(prem.lastFundingRate)*100;
  const frPrev = frHist.length>1 ? frHist.slice(0,-1).reduce((a,x)=>a+parseFloat(x.fundingRate),0)/(frHist.length-1)*100 : frPct;
  const lsNow=parseFloat(lsArr[lsArr.length-1]?.longShortRatio ?? 1), lsFirst=parseFloat(lsArr[0]?.longShortRatio ?? lsNow);
  return {
    price:ticker.price, chg24h:ticker.changePct,
    priceChangePct: P.cl[st] ? (P.cl[n-1]-P.cl[st])/P.cl[st]*100 : 0,
    oiChangePct: oi[0] ? (oi[oi.length-1]-oi[0])/oi[0]*100 : 0,
    oiFastPct: oi[Math.max(0,oi.length-4)] ? (oi[oi.length-1]-oi[Math.max(0,oi.length-4)])/oi[Math.max(0,oi.length-4)]*100 : 0,
    frPct, frTrend: frPct-frPrev, nextFunding: parseFloat(prem.nextFundingTime),
    lsRatio: lsNow, lsTrend: lsNow-lsFirst,
    topRatio: parseFloat(top[0]?.longShortRatio ?? NaN),
    perpNet: netPct(P.cvd,P.vol,13), spotNet: S ? netPct(S.cvd,S.vol,13) : null,
    perpStruct: structOf(P.hi,P.lo,P.cl,P.cvd), spotStruct: S ? structOf(S.hi,S.lo,S.cl,S.cvd) : null,
    px:{o:P.op,h:P.hi,l:P.lo,c:P.cl}, pcvd:{o:P.cvdO,c:P.cvd}, scvd: S?{o:S.cvdO,c:S.cvd}:null, hasSpot: !!S,
    period, demo:false,
  };
}

// ============================================================ 評分引擎 v4
function scoreCoin(d){
  const pc=d.priceChangePct, oi=d.oiChangePct, fr=d.frPct, frT=d.frTrend, ls=d.lsRatio, lsT=d.lsTrend;
  const pn=d.perpNet, sn=d.spotNet, ps=d.perpStruct, ss=d.spotStruct, sm=d.topRatio;
  const s=(n,dd=2)=>(n>=0?"+":"")+n.toFixed(dd);
  const UP=0.3, oiUp=oi>1;
  const pUp=pn>UP, pDn=pn<-UP, sUp=sn!=null&&sn>UP, sDn=sn!=null&&sn<-UP;
  const bothAbsorbBull = ps&&ps.dir==="bull"&&ps.kind==="absorb" && ss&&ss.dir==="bull"&&ss.kind==="absorb";
  const bothAbsorbBear = ps&&ps.dir==="bear"&&ps.kind==="absorb" && ss&&ss.dir==="bear"&&ss.kind==="absorb";
  const frFalling=frT<-0.002, frRising=frT>0.002;
  // 使用者定義的反轉組合
  const longCombo  = bothAbsorbBull && (fr<0 || frFalling) && (lsT<-0.02 || ls<1);
  const shortCombo = bothAbsorbBear && oiUp && (fr>0 || frRising);
  const healthyUp   = pc>0 && oiUp && pUp && sUp;
  const healthyDown = pc<0 && oiUp && pDn && sDn;
  const anyAbsorbBull = (ps&&ps.dir==="bull"&&ps.kind==="absorb")||(ss&&ss.dir==="bull"&&ss.kind==="absorb");
  const anyAbsorbBear = (ps&&ps.dir==="bear"&&ps.kind==="absorb")||(ss&&ss.dir==="bear"&&ss.kind==="absorb");
  const anyExhBull = !anyAbsorbBull && ((ps&&ps.dir==="bull")||(ss&&ss.dir==="bull"));
  const anyExhBear = !anyAbsorbBear && ((ps&&ps.dir==="bear")||(ss&&ss.dir==="bear"));
  const sNote = d.hasSpot ? "" : "（此幣無對應現貨交易對，現貨 CVD 無法取得）";

  const longChecks=[
    { pts:4, ok:longCombo, label:"底部雙 CVD 吸收反轉組合", meaning:"你的核心做多結構：價格未再創新低，但現貨與合約 CVD 雙雙創低——代表兩邊市場的散戶都在恐慌拋售，價格卻被主力用限價買單全數承接；此時資金費率轉負（空頭付費）、多空比走弱（散戶轉空），正是趨勢終結、主力完成建倉的組合。合約與現貨同時吸收，排除了單邊槓桿假動作的可能。", now: longCombo?`完整成立：價格守住不破底，現貨與合約 CVD 皆創低被吸收，資費 ${s(fr,4)}%（趨勢 ${s(frT,4)}）、多空比 ${ls.toFixed(2)}（趨勢 ${s(lsT,2)}）同步轉弱——底部反轉組合，權重最高。`:(bothAbsorbBull?`雙 CVD 吸收已成立，但資費／多空比尚未同步轉弱（資費 ${s(fr,4)}%、多空比 ${ls.toFixed(2)}），組合未完整。`:`尚未出現現貨＋合約同時的底部吸收結構。${sNote}`) },
    { pts:4, ok:healthyUp, label:"健康多頭趨勢（價漲+OI+雙CVD）", meaning:"健康上漲的完整定義：價格上漲、OI 增加（新資金開多）、合約 CVD 上升（槓桿追價）、現貨 CVD 也上升（真金白銀買入）。四者同步才代表趨勢由實質買盤推動、可延續；缺了現貨 CVD 就只是槓桿情緒，缺了 OI 就只是換手。", now: healthyUp?`完整成立：價格 ${s(pc)}%、OI ${s(oi)}%、合約淨主動買 ${s(pn)}%、現貨淨主動買 ${s(sn)}%——實質資金推動的健康上漲。`:`未同時滿足（價格 ${s(pc)}%、OI ${s(oi)}%、合約 ${s(pn)}%、現貨 ${sn==null?"無":s(sn)}%），非完整健康多頭。${sNote}` },
    { pts:3, ok:anyAbsorbBull&&!longCombo, label:"CVD 吸收結構（看漲）", meaning:"吸收＝價格不再破底、但 CVD 持續走低，主力用限價買單默默吃掉散戶拋售。吸收代表主力已在實際承接（有成交），可信度高於衰竭，因此權重較重。", now: anyAbsorbBull?(longCombo?`已計入上方完整反轉組合，此項不重複加分。`:`偵測到底部吸收：${(ps&&ps.dir==="bull"&&ps.kind==="absorb"?"合約":"現貨")}端 ${(ps&&ps.dir==="bull"?ps.desc:ss.desc)}`):`未偵測到底部吸收結構。` },
    { pts:2, ok:anyExhBull, label:"CVD 衰竭結構（看漲）", meaning:"衰竭＝價格破底但 CVD 未同步創低，代表賣方力竭、沒人跟著砸。衰竭只說明「空方沒力」，不代表主力已進場承接，可信度低於吸收，故權重較輕。", now: anyExhBull?`偵測到賣壓衰竭：${(ps&&ps.dir==="bull"?ps.desc:ss.desc)}`:`未偵測到賣壓衰竭結構。` },
    { pts:2, ok:sUp, label:"現貨 CVD 上升（真金白銀）", meaning:"現貨 CVD 代表沒有槓桿的實質買盤。講義：只有現貨 CVD 同步配合價格上漲，才真正代表有實質資金推動趨勢延續；合約 CVD 飆升但現貨不動，多半是槓桿誘多。", now: sn==null?`此幣無對應現貨交易對，無法取得現貨 CVD，不加分。`:(sUp?`現貨淨主動買 ${s(sn)}%，有實質買盤進場支撐。`:`現貨淨主動買 ${s(sn)}%，未見實質買盤，不加分。`) },
    { pts:2, ok:!isNaN(sm)&&sm>=1.05&&sm>ls, label:"聰明錢偏多（大戶領先散戶）", meaning:"大戶持倉多空比（幣安持倉前段交易者）對照散戶多空比。大戶淨多且比散戶更偏多＝聰明錢站多方；若散戶反向偏空，即為主力吸籌背離。", now: isNaN(sm)?`無大戶持倉數據，不加分。`:((sm>=1.05&&sm>ls)?`大戶 ${sm.toFixed(2)} > 散戶 ${ls.toFixed(2)} 且淨多——聰明錢偏多${ls<1?`，散戶偏空，屬背離偏多訊號。`:`。`}`:`大戶 ${sm.toFixed(2)}、散戶 ${ls.toFixed(2)}，聰明錢未明顯領先偏多，不加分。`) },
    { pts:1, ok:!(ps&&ps.dir==="bear")&&!(ss&&ss.dir==="bear"), label:"無看跌 CVD 結構", meaning:"確認高位沒有出現頂部反轉結構——價格創高但 CVD 未創高（衰竭），或 CVD 創高但價格未創高（吸收／誘多）。", now:(ps&&ps.dir==="bear")||(ss&&ss.dir==="bear")?`警訊：偵測到看跌${(ps&&ps.dir==="bear"?ps.type:ss.type)}，追多風險高。`:`未出現頂部衰竭或吸收結構。` },
    { pts:1, ok:fr<0.05, label:"資金費率未過熱", meaning:"資費為正＝多頭付費，超過 +0.05% 代表多頭槓桿擁擠，是主力反向收割的環境。", now: fr<0.05?`資費 ${s(fr,4)}%（趨勢 ${s(frT,4)}），未過熱。`:`資費 ${s(fr,4)}% 超過 +0.05%，多頭擁擠，不加分。` },
    { pts:1, ok:ls<1.5, label:"散戶未擠在多方", meaning:"散戶擠多方時，下方止損與爆倉點密集，主力有動機向下收割。", now: ls<1.5?`多空比 ${ls.toFixed(2)}（趨勢 ${s(lsT,2)}），未一面倒偏多。`:`多空比 ${ls.toFixed(2)} 超過 1.5，散戶擠多方，不加分。` },
  ];

  const shortChecks=[
    { pts:4, ok:shortCombo, label:"頂部雙 CVD 吸收反轉組合", meaning:"你的核心做空結構：價格未再創新高，但現貨與合約 CVD 雙雙創高——代表兩邊市場的散戶都在市價追多，價格卻上不去，被主力用限價賣單全數吸收；同時 OI 持續上升（新倉不斷進場）、資金費率上升（多頭付費撐倉），正是誘多完成、趨勢終結的組合。", now: shortCombo?`完整成立：價格未創新高，現貨與合約 CVD 皆創高被吸收，OI ${s(oi)}% 續增、資費 ${s(fr,4)}%（趨勢 ${s(frT,4)}）上升——頂部反轉組合，權重最高。`:(bothAbsorbBear?`雙 CVD 吸收已成立，但 OI／資費尚未同步配合（OI ${s(oi)}%、資費 ${s(fr,4)}%），組合未完整。`:`尚未出現現貨＋合約同時的頂部吸收結構。${sNote}`) },
    { pts:4, ok:healthyDown, label:"健康空頭趨勢（價跌+OI+雙CVD）", meaning:"健康下跌的完整定義：價格下跌、OI 增加（新空單進場）、合約 CVD 下降、現貨 CVD 也下降（實質賣出）。四者同步代表跌勢由真實賣壓推動，而非多單止損造成的清槓桿踩踏。", now: healthyDown?`完整成立：價格 ${s(pc)}%、OI ${s(oi)}%、合約淨主動賣 ${s(pn)}%、現貨淨主動賣 ${s(sn)}%——實質賣壓推動的健康下跌。`:`未同時滿足（價格 ${s(pc)}%、OI ${s(oi)}%、合約 ${s(pn)}%、現貨 ${sn==null?"無":s(sn)}%），非完整健康空頭。${sNote}` },
    { pts:3, ok:anyAbsorbBear&&!shortCombo, label:"CVD 吸收結構（看跌）", meaning:"吸收＝散戶市價追多、CVD 創高，但價格漲不上去，主力以限價賣單承接出貨。吸收代表主力已實際在出貨（有成交），可信度高於衰竭，權重較重。", now: anyAbsorbBear?(shortCombo?`已計入上方完整反轉組合，此項不重複加分。`:`偵測到頂部吸收：${(ps&&ps.dir==="bear"&&ps.kind==="absorb"?"合約":"現貨")}端 ${(ps&&ps.dir==="bear"?ps.desc:ss.desc)}`):`未偵測到頂部吸收結構。` },
    { pts:2, ok:anyExhBear, label:"CVD 衰竭結構（看跌）", meaning:"衰竭＝價格創新高但 CVD 未同步創高，代表買方力竭、沒人跟單。只說明「多方沒力」，未證明主力進場出貨，可信度低於吸收。", now: anyExhBear?`偵測到買盤衰竭：${(ps&&ps.dir==="bear"?ps.desc:ss.desc)}`:`未偵測到買盤衰竭結構。` },
    { pts:2, ok:sDn, label:"現貨 CVD 下降（實質賣壓）", meaning:"現貨 CVD 下降代表真實資金在出場，而非只有槓桿空單在敲。現貨若不跌、只有合約在殺，往往是誘空。", now: sn==null?`此幣無對應現貨交易對，無法取得現貨 CVD，不加分。`:(sDn?`現貨淨主動賣 ${s(sn)}%，實質賣壓存在。`:`現貨淨主動賣 ${s(sn)}%，未見實質賣壓，不加分。`) },
    { pts:2, ok:!isNaN(sm)&&sm<=0.95&&sm<ls, label:"聰明錢偏空（大戶低於散戶）", meaning:"大戶淨空且比散戶更偏空＝聰明錢站空方；若散戶反向偏多，即為主力出貨背離。", now: isNaN(sm)?`無大戶持倉數據，不加分。`:((sm<=0.95&&sm<ls)?`大戶 ${sm.toFixed(2)} < 散戶 ${ls.toFixed(2)} 且淨空——聰明錢偏空${ls>1?`，散戶偏多，屬背離偏空訊號。`:`。`}`:`大戶 ${sm.toFixed(2)}、散戶 ${ls.toFixed(2)}，聰明錢未明顯領先偏空，不加分。`) },
    { pts:1, ok:!(ps&&ps.dir==="bull")&&!(ss&&ss.dir==="bull"), label:"無看漲 CVD 結構", meaning:"確認底部沒有出現反轉結構——價格破底但 CVD 未創低（衰竭），或 CVD 創低但價格守住（吸收／誘空）。", now:(ps&&ps.dir==="bull")||(ss&&ss.dir==="bull")?`警訊：偵測到看漲${(ps&&ps.dir==="bull"?ps.type:ss.type)}，追空風險高。`:`未出現底部衰竭或吸收結構。` },
    { pts:1, ok:fr>-0.05, label:"資金費率未極端偏負", meaning:"資費低於 -0.05% 代表空頭過度擁擠、恐慌放空，追空易被連環軋空。", now: fr>-0.05?`資費 ${s(fr,4)}%（趨勢 ${s(frT,4)}），空頭未過度擁擠。`:`資費 ${s(fr,4)}% 空頭極端擁擠，不加分。` },
    { pts:1, ok:ls>1.5||lsT>0.05, label:"散戶偏多／持續加多（反向）", meaning:"散戶追多達極端或持續加碼多單，下方爆倉流動性密集，是主力向下收割的目標。", now:(ls>1.5||lsT>0.05)?`多空比 ${ls.toFixed(2)}（趨勢 ${s(lsT,2)}），散戶偏多或持續加多，反向偏空。`:`多空比 ${ls.toFixed(2)}（趨勢 ${s(lsT,2)}），散戶未明顯偏多，不加分。` },
  ];
  const sum=a=>Math.min(15,Math.max(1,a.reduce((x,c)=>x+(c.ok?c.pts:0),0)));
  return { longScore:sum(longChecks), shortScore:sum(shortChecks), longChecks, shortChecks, flags:{longCombo,shortCombo,healthyUp,healthyDown} };
}

// ---------- 異常警報 ----------
function detectAnomaly(d){
  if(!d||d.frPct==null) return null;
  const fr=d.frPct, ls=d.lsRatio, pn=d.perpNet, oi=d.oiFastPct??d.oiChangePct, pc=d.priceChangePct;
  const f=scoreCoin(d).flags;
  const abn = Math.abs(oi)>=4 || Math.abs(fr)>=0.1 || ls>=2 || ls<=0.5 || Math.abs(pn)>=5 || f.longCombo || f.shortCombo;
  if(!abn) return null;
  let pump=0,dump=0,tension=0; const R=[];
  if(f.shortCombo){ dump+=3; R.push("頂部雙 CVD 吸收＋OI 增＋資費升（趨勢終結組合）"); }
  if(f.longCombo){ pump+=3; R.push("底部雙 CVD 吸收＋資費轉負＋多空比走弱（趨勢終結組合）"); }
  if(oi>=4){ tension++; R.push(`OI 短線急增 +${oi.toFixed(1)}%（新槓桿大量進場）`); } else if(oi<=-4) R.push(`OI 短線急減 ${oi.toFixed(1)}%（快速平倉／清算）`);
  if(fr>=0.1){ dump+=2; R.push(`資費極端偏多 +${fr.toFixed(3)}%（多頭擁擠，長軋風險）`); } else if(fr>=0.05){ dump++; R.push(`資費偏多 +${fr.toFixed(3)}%`); }
  if(fr<=-0.1){ pump+=2; R.push(`資費極端偏空 ${fr.toFixed(3)}%（空頭擁擠，軋空燃料）`); } else if(fr<=-0.05){ pump++; R.push(`資費偏空 ${fr.toFixed(3)}%`); }
  if(ls>=2){ dump++; R.push(`散戶極度偏多 ${ls.toFixed(2)}（反向下殺目標）`); }
  if(ls<=0.5){ pump++; R.push(`散戶極度偏空 ${ls.toFixed(2)}（反向逼空目標）`); }
  if(pn>=5){ pump++; R.push(`合約主動買盤狂熱 +${pn.toFixed(1)}%`); }
  if(pn<=-5){ dump++; R.push(`合約主動賣壓宣洩 ${pn.toFixed(1)}%`); }
  if(oi>=4&&Math.abs(pc)<1.5){ tension++; R.push("持倉暴增但價格橫盤（壓縮蓄勢，變盤在即）"); }
  let kind,color;
  if(pump-dump>=2){ kind="爆噴傾向"; color=GREEN; } else if(dump-pump>=2){ kind="暴跌傾向"; color=RED; }
  else if(tension>=1){ kind="變盤在即"; color=NEU; } else { kind="高風險區"; color=NEU; }
  const sev=Math.min(5,Math.max(pump,dump)+tension+(Math.abs(fr)>=0.1?1:0));
  return { kind, color, sev, reasons:R };
}

function whaleRead(d){
  const p=d.priceChangePct>1?"up":d.priceChangePct<-1?"down":"flat";
  const o=d.oiChangePct>1?"up":d.oiChangePct<-1?"down":"flat";
  const M={"up|up":["主力做多／進場建倉","多單帶動上漲，非單純拉抬，趨勢具延續性。"],"up|flat":["現貨推動／換手上漲","主力未明顯跟進，需搭配 CVD 確認能否延續。"],"up|down":["空頭回補為主","軋空行情、非主力布局，不宜追多。"],"flat|up":["低位吸籌／高位派發","主力利用盤整布局，觀察 CVD 與資費偏向。"],"flat|flat":["無共識盤／市場冷感","沒量沒意願，觀望為宜。"],"flat|down":["避險退場／觀望居多","事件前空倉、波動收縮階段。"],"down|up":["主力做空／主動加碼空單","非一般殺多，空方主導明確。"],"down|flat":["現貨砸盤／換手殺跌","未見加倉，疑似誘空，提防反拉。"],"down|down":["多單爆倉／清槓桿","強制平倉主導下跌，屬市場踩踏，提防反彈。"]};
  return M[`${p}|${o}`];
}

async function loadCoins(){
  state.live=null; render();

    state.coins=all.filter(t=>t.symbol.endsWith("USDT")&&parseFloat(t.quoteVolume)>0).sort((a,b)=>parseFloat(b.quoteVolume)-parseFloat(a.quoteVolume))
      .map(t=>({symbol:t.symbol,price:parseFloat(t.lastPrice),changePct:parseFloat(t.priceChangePercent)}));
    state.live=true;
  }catch{ state.live=false; state.coins=[]; }
  render(); if(state.live) ensureScores();
}
function changePeriod(p){ if(p===state.period) return; state.period=p; for(const k in cache) delete cache[k]; state.alerts=[]; state.alertStatus=null; render();
  if(state.selected){ state.data=null; render(); refreshData(); } else if(state.view==="alerts") scanAlerts(); else ensureScores(); }
function getFiltered(){ if(!state.coins) return [];
  if(state.view==="watch") return state.coins.filter(c=>isWatched(c.symbol));
  const q=state.query.trim().toUpperCase(); let l=q?state.coins.filter(c=>c.symbol.includes(q)):state.coins.slice();
  if(state.sort==="long"||state.sort==="short"){ const k=state.sort==="long"?"longScore":"shortScore";
    l.sort((a,b)=>(cache[b.symbol]?scoreCoin(cache[b.symbol])[k]:-1)-(cache[a.symbol]?scoreCoin(cache[a.symbol])[k]:-1)); }
  return l.slice(0,q?40:25); }
function rankBy(k){ return (state.coins||[]).filter(c=>cache[c.symbol]).map(c=>({symbol:c.symbol,sc:scoreCoin(cache[c.symbol])[k]})).sort((a,b)=>b.sc-a.sc).slice(0,5); }
async function ensureScores(){ if(!state.live||state.selected||(state.view!=="market"&&state.view!=="watch")) return;
  const t=getFiltered().filter(c=>!cache[c.symbol]&&!inflight.has(c.symbol)); if(!t.length) return;
  await pool(t,3,async c=>{ inflight.add(c.symbol);

async function scanAlerts(){ if(!state.live) return; state.alertStatus="scanning"; state.alertProg=0; renderAlerts();
  const T=(state.coins||[]).slice(0,40); const need=T.filter(c=>!cache[c.symbol]); let done=T.length-need.length;
  await pool(need,3,async c=>{ try{ cache[c.symbol]=await fetchIndicators(c.symbol,c,state.period); }catch{} done++; state.alertProg=done;
    throttle("ap",()=>{ const e=document.getElementById("aprog"); if(e) e.textContent=`掃描中 ${done}/${T.length}`; },200); });
  state.alerts=T.map(c=>({coin:c,a:detectAnomaly(cache[c.symbol])})).filter(x=>x.a).sort((a,b)=>b.a.sev-a.a.sev);
  state.alertStatus="done"; renderAlerts(); }

async function refreshData(){ const c=state.coins.find(x=>x.symbol===state.selected);

async function openCoin(sym){ state.selected=sym; state.tab="long"; state.expanded=null;

function listScreen(){ const sb=(k,l)=>`<button data-action="sort" data-sort="${k}" class="flex-1 py-2 text-[12px] tracking-wider ${state.sort===k?"bg-white text-black font-semibold":"text-neutral-500"}">${l}</button>`;

    ${!state.coins?`<div class="text-center text-neutral-600 text-sm py-10">載入幣種清單中⋯</div>`:`<ul id="coin-list" class="mt-1">${coinRows()}</ul>`}
    ${state.live?`<p class="text-[11px] text-neutral-600 mt-4 leading-relaxed">評分依「${pLabel()}」週期計算，整合現貨＋合約雙 CVD。全部 USDT 永續皆可搜尋。</p>`:""}<div class="mt-6 text-center"><button data-action="logout" class="text-[11px] text-neutral-700 underline">登出此裝置</button></div>`;
  return `${header()}<main class="px-4 py-4">${state.live===false?`<div class="mb-3 border border-neutral-700 text-neutral-400 text-[12px] px-3 py-2.5 leading-relaxed">無法連上幣安 API。請確認此頁在一般瀏覽器開啟（非 Claude 預覽），再按「重試」。</div>`:""}${viewNav()}${periodBar()}${state.view==="alerts"?`<section id="alerts">${alertsInner()}</section>`:state.view==="watch"?`<div class="text-[11px] text-neutral-500 mb-2">觀察清單 · ${pLabel()}週期（${watch.length} 檔）</div><ul id="coin-list">${coinRows()}</ul>`:mk}</main>`; }
function bar(sc,c){ let h=""; for(let i=0;i<15;i++) h+=`<div class="h-3 flex-1" style="background:${i<sc?c:GREY}"></div>`; return `<div class="flex gap-1">${h}</div>`; }
function statCard(k,v,s){ return `<div class="border border-neutral-800 p-3"><div class="text-[10px] tracking-widest text-neutral-500 uppercase">${k}</div><div class="text-lg mono text-white mt-1">${v}</div>${s?`<div class="text-[11px] text-neutral-500 mt-0.5">${s}</div>`:""}</div>`; }
function cvdSection(d){
  const tag=s=>s?`<span class="text-[10px] px-1.5 py-0.5" style="color:${s.dir==="bull"?GREEN:RED};border:1px solid ${s.dir==="bull"?GREEN:RED}">${s.dir==="bull"?"看漲":"看跌"}${s.kind==="absorb"?"吸收":"衰竭"}</span>`:`<span class="text-[10px] text-neutral-600">無結構</span>`;
  const ps=d.perpStruct, ss=d.spotStruct, ch=state.chart;
  const wick=a=>candles(a.map(x=>x.o),a.map(x=>x.h),a.map(x=>x.l),a.map(x=>x.c),64);
  const flat=o=>candles(o.o,o.o.map((v,i)=>Math.max(v,o.c[i])),o.o.map((v,i)=>Math.min(v,o.c[i])),o.c,64);
  const perpChart = ch&&ch.status==="done"&&ch.perp ? wick(ch.perp) : flat(d.pcvd);
  const spotChart = d.hasSpot ? (ch&&ch.status==="done"&&ch.spot ? wick(ch.spot) : flat(d.scvd)) : "";
  const note = ch&&ch.status==="loading" ? "影線計算中⋯" : ch&&ch.status==="done" ? `影線由低時框（${LTFOF[state.period][0]}）聚合，反映棒內 CVD 曾觸及的極值` : "影線暫不可用，顯示實體";
  return `<section id="cvdsec" class="mt-5 border border-neutral-800 p-3">
    <div class="text-[10px] tracking-widest text-neutral-500 uppercase mb-2">價格 / CVD K 線 · ${pLabel()} · 近 30 根</div>
    <div class="text-[10px] text-neutral-600 mb-0.5">價格</div>${candles(d.px.o,d.px.h,d.px.l,d.px.c,76)}
    <div class="flex items-center justify-between mt-3 mb-0.5"><span class="text-[10px] text-neutral-600">合約 CVD（槓桿情緒）</span>${tag(ps)}</div>${perpChart}
    <div class="flex items-center justify-between mt-3 mb-0.5"><span class="text-[10px] text-neutral-600">現貨 CVD（真金白銀）</span>${d.hasSpot?tag(ss):`<span class="text-[10px] text-neutral-600">無現貨對</span>`}</div>${d.hasSpot?spotChart:`<div class="text-[11px] text-neutral-600 py-2">此幣無對應現貨交易對。</div>`}
    <p class="text-[12px] text-neutral-400 mt-2 leading-relaxed">${ps?`合約：${ps.desc}`:"合約 CVD 與價格同步，無吸收／衰竭結構。"}${ss?`<br>現貨：${ss.desc}`:""}</p>
    <p class="text-[10px] text-neutral-600 mt-1.5">CVD K 棒：實體＝當根淨主動買賣（綠=買方主導、紅=賣方主導）；上影線＝棒內買方曾推高但被賣回（吸收跡象），下影線反之。${note}。</p></section>`; }
function detailScreen(){ const sym=state.selected.replace("USDT",""); const d=state.data;
  let body=`<div class="text-center text-neutral-600 text-sm py-14">抓取幣安指標中⋯</div>`;
  if(d&&!d.demo){ const r=scoreCoin(d), w=whaleRead(d), ac=state.tab==="long"?GREEN:RED, an=detectAnomaly(d);
    const checks=(state.tab==="long"?r.longChecks:r.shortChecks).map((c,i)=>{ const o=state.expanded===i;
      return `<li class="border ${c.ok?"border-neutral-600":"border-neutral-900"}"><button data-action="expand" data-idx="${i}" class="w-full text-left p-3"><div class="flex justify-between items-baseline gap-2 ${c.ok?"":"opacity-50"}"><span class="text-sm ${c.ok?"text-white":"text-neutral-500"}"><span style="${c.ok?"color:"+ac:""}">${c.ok?"✓ ":"✕ "}</span>${c.label}</span><span class="mono text-xs shrink-0" style="color:${c.ok?ac:"#525252"}">${c.ok?"+"+c.pts:"0/"+c.pts}</span></div><div class="mt-2 flex gap-2"><span class="w-0.5 shrink-0" style="background:${c.ok?ac:"#404040"}"></span><p class="text-[12px] leading-relaxed ${c.ok?"text-neutral-300":"text-neutral-500"}">${c.now}</p></div>${o?`<div class="mt-2.5 border-t border-neutral-800 pt-2.5"><div class="text-[10px] tracking-widest text-neutral-500 uppercase mb-1">這個數據在看什麼</div><p class="text-[12px] text-neutral-400 leading-relaxed">${c.meaning}</p></div>`:""}<div class="text-[10px] text-neutral-600 mt-2">${o?"收合 ▴":"指標教學 ▾"}</div></button></li>`; }).join("");
    const nf=d.nextFunding?Math.max(0,Math.floor((d.nextFunding-Date.now())/60000)):null;
    const upd=state.updatedAt?new Date(state.updatedAt).toLocaleTimeString("zh-Hant",{hour12:false}):"";
    const ab=an?`<div class="mt-4 border p-3" style="border-color:${an.color}"><div class="flex items-center gap-2"><span class="text-[11px] px-1.5 py-0.5" style="color:${an.color};border:1px solid ${an.color}">⚠ ${an.kind}</span><span class="text-[11px] text-neutral-500">異常警報 · ${pLabel()}</span></div><ul class="mt-2 space-y-1">${an.reasons.map(x=>`<li class="text-[12px] text-neutral-300 flex gap-1.5"><span style="color:${an.color}">•</span>${x}</li>`).join("")}</ul></div>`:"";
    body=`<div class="flex items-baseline justify-between"><h2 class="text-2xl font-bold text-white flex items-center gap-2"><button data-action="star" data-symbol="${state.selected}" class="text-xl" style="color:${isWatched(state.selected)?"#fff":"#3f3f3f"}">${isWatched(state.selected)?"★":"☆"}</button>${sym}<span class="text-neutral-600 text-xs font-normal ml-2">USDT 永續</span></h2><div class="text-right mono"><div class="text-lg text-white">${fmt(d.price)}</div><div class="text-[11px]" style="color:${d.priceChangePct>=0?GREEN:RED}">${pLabel()} ${d.priceChangePct>=0?"+":""}${d.priceChangePct.toFixed(2)}%</div><div class="text-[10px] text-neutral-600">24h ${d.chg24h>=0?"+":""}${d.chg24h.toFixed(2)}%</div></div></div>${ab}
      <section class="mt-5 space-y-4"><div class="border border-neutral-800 p-4" style="border-left:3px solid ${GREEN}"><div class="flex items-baseline justify-between mb-2"><span class="text-[11px] tracking-widest text-neutral-500">做多評分 · ${pLabel()}</span><span class="mono text-xl" style="color:${GREEN}">${r.longScore}<span class="text-neutral-600 text-xs">/15</span><span class="text-xs ml-2 text-neutral-300">${verdict(r.longScore)}</span></span></div>${bar(r.longScore,GREEN)}</div>
      <div class="border border-neutral-800 p-4" style="border-left:3px solid ${RED}"><div class="flex items-baseline justify-between mb-2"><span class="text-[11px] tracking-widest text-neutral-500">做空評分 · ${pLabel()}</span><span class="mono text-xl" style="color:${RED}">${r.shortScore}<span class="text-neutral-600 text-xs">/15</span><span class="text-xs ml-2 text-neutral-300">${verdict(r.shortScore)}</span></span></div>${bar(r.shortScore,RED)}</div></section>
      ${cvdSection(d)}
      <section class="mt-5 border-l-2 border-white pl-4 py-1"><div class="text-[10px] tracking-widest text-neutral-500 uppercase">主力行為判讀（價格 × OI）</div><div class="text-white font-semibold mt-1">${w[0]}</div><div class="text-[13px] text-neutral-400 mt-0.5 leading-relaxed">${w[1]}</div></section>
      <section class="mt-5 grid grid-cols-2 gap-2">
        ${statCard("OI 變化 · "+pLabel(),(d.oiChangePct>=0?"+":"")+d.oiChangePct.toFixed(2)+"%",`短線 ${d.oiFastPct>=0?"+":""}${d.oiFastPct.toFixed(2)}%`)}
        ${statCard("資金費率",d.frPct.toFixed(4)+"%",`趨勢 ${d.frTrend>=0?"+":""}${d.frTrend.toFixed(4)}${nf!=null?` · ${nf}分後結算`:""}`)}
        ${statCard("合約 CVD 淨主動",(d.perpNet>=0?"+":"")+d.perpNet.toFixed(2)+"%","佔成交量比，正=買主導")}
        ${statCard("現貨 CVD 淨主動",d.spotNet==null?"—":(d.spotNet>=0?"+":"")+d.spotNet.toFixed(2)+"%",d.spotNet==null?"無現貨交易對":"真實資金方向")}
        ${statCard("散戶多空比",d.lsRatio.toFixed(2),`趨勢 ${d.lsTrend>=0?"+":""}${d.lsTrend.toFixed(2)}`)}
        ${!isNaN(d.topRatio)?statCard("大戶持倉多空比",d.topRatio.toFixed(2),d.topRatio>d.lsRatio?"聰明錢較散戶偏多":"聰明錢較散戶偏空"):""}
      </section>
      <section class="mt-5"><div class="flex border border-neutral-800"><button data-action="tab" data-tab="long" class="flex-1 py-2.5 text-sm tracking-widest" style="${state.tab==="long"?`background:${GREEN};color:#000;font-weight:600`:"color:#737373"}">做多加分項</button><button data-action="tab" data-tab="short" class="flex-1 py-2.5 text-sm tracking-widest" style="${state.tab==="short"?`background:${RED};color:#000;font-weight:600`:"color:#737373"}">做空加分項</button></div>
      <div class="text-[11px] text-neutral-500 mt-2 px-1">加權：滿分 15。反轉組合／健康趨勢 +4 ＞ CVD 吸收 +3 ＞ 衰竭・現貨CVD・聰明錢 +2 ＞ 其他 +1。吸收權重高於衰竭。</div>
      <ul class="mt-2 space-y-2">${checks}</ul></section>
      <div class="flex items-center justify-between mt-6"><span class="text-[11px] text-neutral-600">最後更新 ${upd} · 每 60 秒自動刷新</span><button data-action="refresh" class="text-[11px] underline text-neutral-400">立即刷新</button></div>
      <p class="mt-3 text-[11px] text-neutral-600 leading-relaxed">整合現貨／合約雙 CVD、OI、資金費率與趨勢、多空比與趨勢、大戶持倉，依所選週期計算，屬輔助判讀、非投資建議。</p>`; }
  return `${header()}<main class="px-4 py-4 pb-12"><button data-action="back" class="text-[12px] tracking-widest text-neutral-500 uppercase mb-4">← 返回</button>${body}</main>`; }
function render(){ const app=document.getElementById("app");
  app.innerHTML=state.selected?detailScreen():listScreen();
  if(!state.selected&&state.view==="market"){ const i=document.getElementById("search"); if(i) i.addEventListener("input",e=>{ state.query=e.target.value; renderList(); ensureScores(); }); } }
document.getElementById("app").addEventListener("click",e=>{ const el=e.target.closest("[data-action]"); if(!el) return; const a=el.dataset.action;
  if(a==="logout"){ logout(); }
  else if(a==="star"){ toggleWatch(el.dataset.symbol); render(); if(!state.selected) ensureScores(); }
  else if(a==="open") openCoin(el.dataset.symbol); else if(a==="back") back(); else if(a==="retry") loadCoins();
  else if(a==="refresh") refreshData(); else if(a==="rescan") scanAlerts(); else if(a==="view") switchView(el.dataset.v);
  else if(a==="period") changePeriod(el.dataset.p); else if(a==="tab"){ state.tab=el.dataset.tab; state.expanded=null; render(); }
  else if(a==="expand"){ const i=+el.dataset.idx; state.expanded=state.expanded===i?null:i; render(); }
  else if(a==="sort"){ state.sort=el.dataset.sort; render(); ensureScores(); } });
// ============================================================
// 存取密碼設定（社群門檻）
//   換密碼步驟：1) 到 網址?hash 產生新雜湊 2) 貼到 hash 3) version +1
//   version 一改，所有人下次開啟都必須重新輸入密碼。
//   注意：純前端驗證僅為門檻，非真正加密，請勿當作機密保護。
// ============================================================
const AUTH = { version: 2, hash: "42610e8b4098aa4b", hint: "請向 Humble Trader Academy 管理員索取" };
function hashPw(s){ let h1=0x811c9dc5>>>0, h2=0x01000193>>>0;
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul((h2+c)^(h1>>>7),2246822519)>>>0; }
  return (h1>>>0).toString(16).padStart(8,"0")+(h2>>>0).toString(16).padStart(8,"0"); }
function authed(){ try{ return localStorage.getItem("hta_key")===AUTH.version+":"+AUTH.hash; }catch{ return false; } }
function setAuthed(){ try{ localStorage.setItem("hta_key",AUTH.version+":"+AUTH.hash); }catch{} }
function logout(){ try{ localStorage.removeItem("hta_key"); }catch{} location.reload(); }
function lockScreen(err){
  return `<div class="min-h-screen flex flex-col justify-center px-6">
    <div class="text-xl font-bold tracking-[0.18em] text-white leading-tight text-center">HUMBLE TRADER<span class="block">ACADEMY</span></div>
    <div class="text-[13px] text-neutral-400 mt-2 tracking-widest text-center">永續合約數據網站</div>
    <div class="mt-8 border border-neutral-800 p-5">
      <div class="text-[11px] tracking-widest text-neutral-500 uppercase mb-3">社群成員專用 · 請輸入密碼</div>
      <input id="pw" type="password" inputmode="text" autocomplete="off" placeholder="輸入通行密碼"
        class="w-full bg-neutral-900 border border-neutral-700 text-white px-4 py-3 text-sm outline-none focus:border-white placeholder-neutral-600" />
      ${err?`<div class="text-[12px] mt-2" style="color:${RED}">${err}</div>`:""}
      <button id="pwgo" class="w-full mt-3 py-3 bg-white text-black text-sm font-semibold tracking-widest">進 入</button>
      <div class="text-[11px] text-neutral-600 mt-3 leading-relaxed">通過後此裝置會記住，之後開啟免再輸入；管理員更新密碼時需重新輸入。${AUTH.hint}</div>
    </div></div>`; }
function renderLock(err){
  const app=document.getElementById("app"); app.innerHTML=lockScreen(err);
  const go=()=>{ const v=(document.getElementById("pw").value||"").trim();
    if(hashPw(v)===AUTH.hash){ setAuthed(); boot(); } else renderLock("密碼錯誤，請再試一次"); };
  document.getElementById("pwgo").addEventListener("click",go);
  document.getElementById("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  document.getElementById("pw").focus(); }
function renderHashTool(){
  const app=document.getElementById("app");
  app.innerHTML=`<div class="min-h-screen px-6 py-10"><div class="text-[11px] tracking-widest text-neutral-500 uppercase mb-3">管理工具 · 產生密碼雜湊</div>
    <input id="np" placeholder="輸入新密碼" class="w-full bg-neutral-900 border border-neutral-700 text-white px-4 py-3 text-sm outline-none focus:border-white placeholder-neutral-600" />
    <button id="ng" class="w-full mt-3 py-3 bg-white text-black text-sm font-semibold tracking-widest">產生雜湊</button>
    <div id="nr" class="mt-4 text-[13px] mono text-white break-all"></div>
    <p class="text-[11px] text-neutral-600 mt-4 leading-relaxed">把產生的雜湊貼到程式碼中 AUTH.hash，並將 AUTH.version 加 1，重新部署即可更新密碼；所有人下次開啟都需重新輸入。</p></div>`;
  document.getElementById("ng").addEventListener("click",()=>{
    const v=(document.getElementById("np").value||"").trim();
    document.getElementById("nr").innerHTML = v? `hash: "${hashPw(v)}"` : "請先輸入密碼"; }); }
function boot(){ if(location.search.indexOf("hash")>=0) return renderHashTool(); if(!authed()) return renderLock(); loadCoins(); }
boot();
</script>
